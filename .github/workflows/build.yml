name: Build Kernel M12 + KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 1. Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: 4.19.111-samsung
          fetch-depth: 1

      - name: 2. Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            lz4 zip tar gzip curl wget git cpio

      - name: 3. Setup Toolchains (Samsung Clang 9 + GCC 4.9)
        run: |
          mkdir -p toolchains

          # 1. GCC 4.9 aarch64
          echo "Downloading GCC 4.9..."
          mkdir -p toolchains/gcc_tmp
          curl -L --retry 3 "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/lineage-19.1.tar.gz" | tar -xz -C toolchains/gcc_tmp
          mv toolchains/gcc_tmp/* toolchains/aarch64-linux-android-4.9
          rm -rf toolchains/gcc_tmp

          # 2. Clang 9 (clang-r353983c / 5484270) - exact Samsung compiler
          echo "Downloading Clang r353983c..."
          mkdir -p toolchains/android_prebuilts_clang_host_linux-x86_clang-5484270-9.0
          curl -L --retry 3 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r353983c.tar.gz" | tar -xz -C toolchains/android_prebuilts_clang_host_linux-x86_clang-5484270-9.0

          # 3. Symlink for proton-clang-13-clang expected by build_kernel.sh
          ln -sf android_prebuilts_clang_host_linux-x86_clang-5484270-9.0 toolchains/proton-clang-13-clang

          echo "Toolchains ready:"
          ls -la toolchains/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc
          ls -la toolchains/android_prebuilts_clang_host_linux-x86_clang-5484270-9.0/bin/clang

      - name: 4. Integrate KernelSU v0.9.5
        run: |
          # Use official KernelSU non-GKI setup script for v0.9.5
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" | bash -s v0.9.5

          # Verify integration
          ls -la drivers/kernelsu
          grep -i "kernelsu" drivers/Makefile
          grep -i "kernelsu" drivers/Kconfig

          # Enable in defconfig
          DC="arch/arm64/configs/exynos850-m12nsxx_defconfig"
          echo "" >> $DC
          echo "CONFIG_KSU=y" >> $DC
          echo "CONFIG_KPROBES=y" >> $DC
          echo "CONFIG_HAVE_KPROBES=y" >> $DC
          echo "CONFIG_KPROBE_EVENTS=y" >> $DC
          echo "CONFIG_OVERLAY_FS=y" >> $DC
          tail -10 $DC

      - name: 5. Build Kernel
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh

      - name: 6. Check Build Output
        run: |
          echo "=== arch/arm64/boot ==="
          ls -lh arch/arm64/boot/Image
          ls -lh arch/arm64/boot/dts/samsung/*.dtb 2>/dev/null || true

      - name: 7. Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-m12-kernelsu
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/samsung/*.dtb
          retention-days: 7
